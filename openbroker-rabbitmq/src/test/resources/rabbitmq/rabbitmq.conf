# Settings every test node shares. The fixture appends the cluster formation (or the TLS listeners).
default_user = admin
default_pass = admin-secret
default_vhost = /
loopback_users = none
log.console = true
log.console.level = info
# A test node never stops for lack of disk or memory on a shared CI runner.
disk_free_limit.absolute = 50MB
vm_memory_high_watermark.absolute = 768MB
# Cluster nodes boot together: a node that cannot reach the others yet tries again.
cluster_formation.node_cleanup.interval = 10
cluster_partition_handling = pause_minority
management.rates_mode = detailed
