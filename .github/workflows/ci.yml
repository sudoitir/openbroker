name: CI

# Pull requests carry the verification; a release is cut by pushing a vX.Y.Z tag (release.yml).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Build, unit tests, and the TCK against the oldest and newest supported Artemis.
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        artemis: ["apache/activemq-artemis:2.33.0", "apache/artemis:2.57.0"]
    name: verify (${{ matrix.artemis }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: ./mvnw -B verify -Dartemis.image=${{ matrix.artemis }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.artemis == 'apache/artemis:2.57.0'
        with:
          name: coverage
          path: openbroker-artemis/target/site/jacoco-aggregate

  # The API may not break without the right version bump (SemVer; minor while 0.x), compared with
  # openbroker.previous.version, the last release on Central.
  api-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Compare with the last release
        run: |
          previous=$(./mvnw -B -q help:evaluate -Dexpression=openbroker.previous.version -DforceStdout)
          if [ -z "$previous" ]; then echo "No release yet; nothing to compare."; exit 0; fi
          ./mvnw -B -Papi-check -DskipTests verify

  sonar:
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: openbroker-artemis/target/site/jacoco-aggregate
      - name: Analyse
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          ./mvnw -B -DskipTests -Dspotless.apply.skip test-compile
          org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar

  # The one required status check.
  ci-ok:
    runs-on: ubuntu-latest
    if: always()
    needs: [verify, api-check]
    steps:
      - run: |
          for r in "${{ needs.verify.result }}" "${{ needs.api-check.result }}"; do
            case "$r" in success|skipped) ;; *) echo "A required job ended as $r"; exit 1;; esac
          done
