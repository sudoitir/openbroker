name: CI

# Pull requests carry the verification; a release is cut by pushing a vX.Y.Z tag (release.yml).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Build, unit tests, and the TCK against the oldest and newest supported Artemis and Kafka. A driver's
  # entries build its module and what it needs; the Kafka driver's integration tests run only on the
  # Kafka entries and the Artemis driver's only on the Artemis ones.
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { driver: artemis, image: "apache/activemq-artemis:2.33.0" }
          - { driver: artemis, image: "apache/artemis:2.57.0" }
          - { driver: kafka, image: "confluentinc/cp-kafka:7.0.16", profile: "-Pzookeeper" }
          - { driver: kafka, image: "apache/kafka:3.9.2" }
          - { driver: kafka, image: "apache/kafka:4.0.2" }
          - { driver: kafka, image: "apache/kafka:4.4.0" }
    name: verify (${{ matrix.image }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - if: matrix.driver == 'artemis'
        run: ./mvnw -B verify -pl '!openbroker-kafka,!openbroker-coverage,!openbroker-benchmarks,!openbroker-spring-boot-autoconfigure,!openbroker-spring-boot-starter' -Dartemis.image=${{ matrix.image }}
      - if: matrix.driver == 'kafka'
        run: ./mvnw -B verify -pl openbroker-kafka,openbroker-coverage -am ${{ matrix.profile }} -Dkafka.image=${{ matrix.image }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.image == 'apache/artemis:2.57.0'
        with:
          name: coverage
          path: openbroker-artemis/target/site/jacoco-aggregate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.image == 'apache/kafka:4.4.0'
        with:
          name: coverage-kafka
          path: openbroker-coverage/target/site/jacoco-aggregate

  # Spring lives only in the two Spring modules (ADR-0027): the Enforcer bans it everywhere else, and
  # this proves the ban holds by adding Spring to the API, which must fail the build on the ban.
  framework-free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Spring in the API must fail the build
        run: |
          if ./mvnw -B -pl openbroker-api -Pspring-ban-proof validate > ban.log 2>&1; then
            echo "Spring in openbroker-api was accepted: the Enforcer ban is not working."; exit 1
          fi
          grep -q "org.springframework:spring-core.*banned" ban.log || { cat ban.log; echo "The build failed, but not on the ban."; exit 1; }

  # The Spring Boot starter on a real broker, wired by @ServiceConnection with no openbroker.* key. The module
  # needs both drivers, so the driver legs above leave it out and it runs here, one broker per entry: the
  # Kafka entry runs the Kafka integration test and the Artemis entry the Artemis one. Its unit tests run on
  # both. The upstream modules are built with their unit tests only.
  spring:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { driver: artemis, image: "apache/artemis:2.57.0", it: SpringBootArtemisIT, property: artemis.image }
          - { driver: kafka, image: "apache/kafka:4.4.0", it: SpringBootKafkaIT, property: kafka.image }
    name: spring (${{ matrix.image }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: >-
          ./mvnw -B verify
          -pl openbroker-spring-boot-autoconfigure,openbroker-spring-boot-starter -am
          -Dit.test=${{ matrix.it }} -Dit.failIfNoSpecifiedTests=false
          -D${{ matrix.property }}=${{ matrix.image }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-spring-${{ matrix.driver }}
          path: openbroker-spring-boot-autoconfigure/target/site/jacoco-aggregate

  # The API may not break without the right version bump (SemVer; minor while 0.x), compared with
  # openbroker.previous.version, the last release on Central.
  api-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Compare with the last release
        run: |
          previous=$(./mvnw -B -q help:evaluate -Dexpression=openbroker.previous.version -DforceStdout)
          if [ -z "$previous" ]; then echo "No release yet; nothing to compare."; exit 0; fi
          current=$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          strict=true
          # While 0.x, raising the minor version declares a break (ADR-0008).
          if [ "${current%%.*}" = 0 ] && [ "$(echo "$current" | cut -d. -f2)" -gt "$(echo "$previous" | cut -d. -f2)" ]; then
            echo "$previous -> $current raises the minor version: breaking changes are declared."
            strict=false
          fi
          ./mvnw -B -Papi-check -DskipTests -Dopenbroker.api.strictZero="$strict" verify

  # The chaos TCK: brokers are killed, partitioned and healed. It takes minutes per image, so verify
  # leaves *ChaosIT out and the chaos profile runs it alone.
  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { driver: artemis, image: "apache/activemq-artemis:2.33.0" }
          - { driver: artemis, image: "apache/artemis:2.57.0" }
          - { driver: kafka, image: "apache/kafka:4.4.0" }
    name: chaos (${{ matrix.image }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - if: matrix.driver == 'artemis'
        run: ./mvnw -B -pl openbroker-artemis -am verify -Pchaos -Dit.test=ArtemisChaosIT -Dartemis.image=${{ matrix.image }}
      - if: matrix.driver == 'kafka'
        run: ./mvnw -B -pl openbroker-kafka -am verify -Pchaos -Dit.test=KafkaChaosIT -Dkafka.image=${{ matrix.image }}

  # The messaging client against its performance budgets (allocation per message is a hard gate;
  # throughput and p99 have wide margins). The recorded budgets file is the candidate for new baselines.
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Package the benchmarks
        run: ./mvnw -B -pl openbroker-benchmarks -am package -DskipTests
      - name: Run the budgets
        run: >-
          java
          -Dbudgets.json=openbroker-benchmarks/target/jmh-result.json
          -Dbudgets.record=openbroker-benchmarks/target/budgets.recorded.json
          -jar openbroker-benchmarks/target/benchmarks.jar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: benchmarks
          path: |
            openbroker-benchmarks/target/jmh-result.json
            openbroker-benchmarks/target/budgets.recorded.json
          if-no-files-found: warn

  sonar:
    runs-on: ubuntu-latest
    needs: [verify, spring]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: openbroker-artemis/target/site/jacoco-aggregate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-kafka
          path: openbroker-coverage/target/site/jacoco-aggregate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-spring-artemis
          path: openbroker-spring-boot-autoconfigure/target/site/jacoco-aggregate-artemis
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-spring-kafka
          path: openbroker-spring-boot-autoconfigure/target/site/jacoco-aggregate-kafka
      - name: Analyse
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          ./mvnw -B -DskipTests -Dspotless.apply.skip test-compile
          org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar

  # The one required status check.
  ci-ok:
    runs-on: ubuntu-latest
    if: always()
    needs: [verify, spring, framework-free, api-check, chaos, bench]
    steps:
      - run: |
          for r in "${{ needs.verify.result }}" "${{ needs.spring.result }}" "${{ needs.framework-free.result }}" "${{ needs.api-check.result }}" "${{ needs.chaos.result }}" "${{ needs.bench.result }}"; do
            case "$r" in success|skipped) ;; *) echo "A required job ended as $r"; exit 1;; esac
          done
